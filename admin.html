<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>لوحة التحكم — Bee Patisserie</title>
  <link rel="icon" type="image/png" href="/images/bee-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ============ LOGIN ============ -->
<section class="login" id="login" hidden>
  <form class="login__card" id="loginForm" autocomplete="off">
    <img class="login__logo" src="/images/logo.png" alt="Bee Group Patisserie" />
    <h1>لوحة التحكم</h1>
    <p>أدخل كلمة مرور المسؤول للمتابعة</p>
    <label class="field">
      <span>كلمة المرور</span>
      <input type="password" id="password" required autocomplete="current-password" />
    </label>
    <p class="form-error" id="loginError" role="alert"></p>
    <button class="btn btn--honey btn--block" type="submit">دخول</button>
  </form>
</section>

<!-- ============ APP ============ -->
<div class="app" id="app" hidden>
  <aside class="side">
    <a class="side__logo" href="#/"><img src="/images/logo.png" alt="Bee Group Patisserie" /></a>
    <nav class="side__nav">
      <a href="#/" data-route="overview">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        نظرة عامة
      </a>
      <a href="#/products" data-route="products">
        <svg viewBox="0 0 24 24"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><path d="M12 22V12M20.5 7 12 12 3.5 7"/></svg>
        الاصناف
      </a>
    </nav>
    <div class="side__foot">
      <a href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        عرض الموقع
      </a>
      <button type="button" id="logout">
        <svg viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l-5-5 5-5M5 12h11"/></svg>
        تسجيل الخروج
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="top__menu" id="menuBtn" type="button" aria-label="القائمة"><span></span><span></span><span></span></button>
      <div>
        <p class="top__crumb" id="crumb">لوحة التحكم</p>
        <h1 class="top__title" id="pageTitle"></h1>
      </div>
      <button class="btn btn--honey" id="addBtn" type="button" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        إضافة صنف
      </button>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<!-- ============ PRODUCT FORM ============ -->
<dialog class="drawer" id="drawer">
  <form class="drawer__form" id="productForm" novalidate>
    <header class="drawer__head">
      <h2 id="formTitle">إضافة صنف</h2>
      <button class="icon-btn" type="button" data-close aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>

    <div class="drawer__body">
      <label class="drop" id="drop">
        <input type="file" id="imageInput" accept="image/*" hidden />
        <img id="preview" alt="" hidden />
        <span class="drop__hint" id="dropHint">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          <strong>اسحب صورة الصنف هنا</strong>
          <small>أو اضغط للاختيار — تُضغط الصورة تلقائياً</small>
        </span>
        <span class="drop__change">تغيير الصورة</span>
      </label>

      <div class="grid2">
        <label class="field"><span>اسم الصنف (عربي) *</span><input name="name.ar" maxlength="80" /></label>
        <label class="field"><span>Name (English)</span><input name="name.en" maxlength="80" dir="ltr" /></label>
        <label class="field"><span>العبارة المميزة (عربي)</span><input name="tagline.ar" maxlength="80" placeholder="مثال: شريحة من الحب" /></label>
        <label class="field"><span>Tagline (English)</span><input name="tagline.en" maxlength="80" dir="ltr" placeholder="e.g. a slice of love" /></label>
        <label class="field field--wide"><span>الوصف (عربي)</span><textarea name="description.ar" rows="3" maxlength="400"></textarea></label>
        <label class="field field--wide"><span>Description (English)</span><textarea name="description.en" rows="3" maxlength="400" dir="ltr"></textarea></label>
        <label class="field"><span>الفئة *</span><select name="category" id="categorySelect"></select></label>
        <label class="field"><span>السعر (ل.س) — اختياري</span><input name="price" type="number" min="0" step="500" inputmode="numeric" /></label>
      </div>

      <div class="switches">
        <label class="switch"><input type="checkbox" name="available" checked /><i></i><span><strong>متاح للبيع</strong><small>الأصناف غير المتاحة لا تظهر في الموقع</small></span></label>
        <label class="switch"><input type="checkbox" name="featured" /><i></i><span><strong>يظهر في التشكيلة المميزة</strong><small>معرض الصفحة الرئيسية</small></span></label>
      </div>
      <p class="form-error" id="formError" role="alert"></p>
    </div>

    <footer class="drawer__foot">
      <button class="btn btn--ghost" type="button" data-close>إلغاء</button>
      <button class="btn btn--honey" type="submit" id="saveBtn">حفظ الصنف</button>
    </footer>
  </form>
</dialog>

<!-- ============ CONFIRM ============ -->
<dialog class="confirm" id="confirm">
  <div class="confirm__icon"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></div>
  <h3>حذف الصنف؟</h3>
  <p id="confirmText"></p>
  <div class="confirm__actions">
    <button class="btn btn--ghost" type="button" data-close>إلغاء</button>
    <button class="btn btn--danger" type="button" id="confirmYes">نعم، احذف</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script type="module" src="/src/admin/admin.js"></script>
</body>
</html>
